name: SportSync CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test-and-build:
    name: Backend CI (TypeCheck, Tests & Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sportsync
          POSTGRES_PASSWORD: sportsyncpassword
          POSTGRES_DB: sportsync_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --workspace=backend
        env:
          DATABASE_URL: "postgresql://sportsync:sportsyncpassword@localhost:5432/sportsync_db?schema=public"

      - name: Run Backend Tests (ISO/IEC 25010)
        run: npm test --workspace=backend
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://sportsync:sportsyncpassword@localhost:5432/sportsync_db?schema=public"
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Build Backend Bundle
        run: npm run build --workspace=backend

  frontend-typecheck-and-build:
    name: Frontend CI (TypeCheck & Vite Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Bundle
        run: npm run build --workspace=frontend
