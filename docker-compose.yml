version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sportsync-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sportsync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sportsync_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sportsync-network

  redis:
    image: redis:7-alpine
    container_name: sportsync-redis
    restart: always
    command: redis-server --appendonly yes --requirepass redispassword
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sportsync-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  sportsync-network:
    driver: bridge
